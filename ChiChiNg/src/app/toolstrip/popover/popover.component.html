
<div class='popover' [@hoverAnimation]='hoverState' 
(mouseenter)="hoverState='hover'" (mouseleave)="hoverState=''"
>
    <button (click)="click($event)" class='circlebutton pulse2'
    
    (focus)="hoverState='hover'"  (focusout)="hoverState = ''">
        <mat-icon svgIcon='{{ icon }}'></mat-icon><br/>
        <span class="tooltiptext">{{title}}</span>
    </button>
    
</div>
